<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Results</title>
</head>
<body>

<h1>Analysis Result</h1>

<h2>Submitted Sequence</h2>

<p th:text="${sequence}"></p>

<h2>Validation</h2>

<p th:if="${valid}">
    DNA sequence is valid.
</p>

<p th:unless="${valid}">
    DNA sequence is NOT valid.
</p>

<a href="/">Back</a>

</body>
</html>
