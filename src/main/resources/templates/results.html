<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Results</title>
</head>

<body>

<h1>Analysis Result</h1>

<h2>Original Input</h2>

<pre th:text="${originalInput}"></pre>

<h2>Cleaned Sequence</h2>

<p th:text="${cleanedSequence}"></p>

<h2>Validation</h2>

<p th:if="${valid}">
    DNA sequence is valid.
</p>

<p th:unless="${valid}">
    DNA sequence is NOT valid.
</p>

<a href="/">Back</a>

</body>
