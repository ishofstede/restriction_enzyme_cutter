<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>DNA Restriction Analyzer</title>
</head>
<body>

<h1>DNA Restriction Analyzer</h1>

<form action="/analyze" method="post">

    <label>DNA Sequence:</label>
    <br><br>

    <textarea name="sequence" rows="12" cols="70"></textarea>

    <br><br>

    <label>Restriction Enzyme:</label>
    <br><br>

    <select name="enzyme">
        <option th:each="enzyme : ${enzymes}"
                th:value="${enzyme.name}"
                th:text="${enzyme.name}">
        </option>
    </select>

    <br><br>

    <h3>Analysis Mode</h3>

    <input type="radio" name="mode" value="enzyme" checked> Selected Enzyme
    <br>
    <input type="radio" name="mode" value="single"> Single Cutters
    <br>
    <input type="radio" name="mode" value="double"> Double Cutters

    <br><br>

    <button type="submit">Analyze</button>

</form>

</body>
</html>
